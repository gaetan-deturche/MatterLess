[package]
name = "matterless-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
matterless-core = { version = "0.1.0", path = "../matterless-core" }
matterless-store = { version = "0.1.0", path = "../matterless-store" }
matterless-sync = { version = "0.1.0", path = "../matterless-sync" }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
