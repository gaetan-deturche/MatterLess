[package]
name = "matterless-view"
# The version the release numbers, which is what the updater compares a
# manifest against. The only copy of it now the shell that carried a second one
# is gone.
version = "0.4.7"
edition = "2024"

[dependencies]
# Direct3D 11 is in the  crate below; nothing else is needed to
# draw. The shader is HLSL and is compiled at startup by the runtime
# compiler, which ships with Windows.
cosmic-text = "0.19"
# The glyph rasteriser cosmic-text already uses, reached directly for one
# thing: its `SwashCache` renders `Format::Alpha` and gives no way to ask for
# a subpixel mask. Same version, so the types are the same types.
swash = "0.2"
matterless-core = { path = "../matterless-core" }
matterless-layout = { path = "../matterless-layout" }
matterless-paint = { path = "../matterless-paint" }
matterless-render = { path = "../matterless-render" }
matterless-sidebar = { path = "../matterless-sidebar" }
matterless-ui = { path = "../matterless-ui" }
matterless-widgets = { path = "../matterless-widgets" }
matterless-store = { path = "../matterless-store" }
matterless-sync = { path = "../matterless-sync" }
# WebP is not optional on this server: its custom emoji come back as WebP, and
# without a decoder for them the picture simply never arrives -- the name is
# resolved, the room is reserved, and what a reader sees is the blank where the
# emoji should be. Animation is not decoded; the first frame is what is drawn.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    # Not for reading one: for the clipboard, which on Print Screen offers a
    # bitmap and nothing else, and which is re-encoded before it is sent.
    "bmp",
] }
# The socket runs on a thread of its own, so the window never blocks on it.
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
serde_json = "1"
# Spelling, in French and English at once, from the Hunspell dictionaries in
# `resources/dictionaries` -- the ones the official desktop client checks with
# on Windows. Pure Rust, with `hashbrown` as its only dependency, where the
# Windows spell checker was judged not good enough and poor with two languages.
spellbook = "0.4"
# The session the app already established, read rather than collected: this
# window has no business asking for a password to mint a second one.
# `windows-native`, explicitly. Version 3 made every platform's credential
# store an optional feature, and with none of them on it falls back to a mock
# that lives in the process: it reads back everything it is given and keeps
# nothing. So the app wrote the session, read it back to check, was satisfied,
# and asked for a password again on the next launch -- for as long as this
# said `keyring = "3"`.
keyring = { version = "3", features = ["windows-native"] }
# Only the window needs these. Kept behind a feature so the crate can still be
# built for a machine with no display -- which is what `--snapshot` and the
# examples that measure layout are for.
winit = { version = "0.30", optional = true }
# The window's handle, to hand Direct3D. winit answers in these types.
raw-window-handle = { version = "0.6", optional = true }
# Headless verification: the same rows written out as an image, for a machine
# with no display and for comparing against the DOM list.
png = { version = "0.18", optional = true }
minisign-verify = "0.2.5"
semver = "1.0.28"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "gzip", "charset"] }
# Named here only to choose the process-wide TLS provider, exactly as the app
# does. `reqwest` names its own, but the WebSocket goes through
# `tokio-tungstenite`, which asks rustls to pick -- and rustls panics rather
# than guess when the binary carries two. It carries two whenever this is built
# beside the app, because Cargo unifies features across a workspace and the
# app's updater plugin brings `ring` in alongside this `aws-lc-rs`. Built alone
# it happened to work, which is the worst way for this to be wrong: `cargo
# build -p matterless-view` signed in and `cargo build --workspace` did not.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

[features]
# On by default so the window is one command. Turned off for a build that only
# needs the layout and the painter, which needs no windowing library at all.
default = ["window"]
window = ["winit", "raw-window-handle", "png"]

[[bin]]
name = "matterless-view"
required-features = ["window"]

[target.'cfg(windows)'.dependencies]
# Raised here rather than through a plugin, so a click reaches this window:
# `on_activated` is an in-process event, which is the case that matters when the
# window is already running.
tauri-winrt-notification = "0.7"
# The reader's own clock. The app gets its offset from the webview; a native
# window has to ask the system, and std cannot.
windows = { version = "0.61.3", features = [
    "Win32_System_Time",
    # Opening the window without raising it over the reader's work.
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # Handing a link to the shell without a command line to parse it, and
    # reaching ITaskbarList3 for the overlay badge.
    "Win32_UI_Shell",
    # Rasterising the badge's digits, and building the icon it becomes.
    "Win32_Graphics_Gdi",
    # ITaskbarList3 is a COM object, so it has to be created like one.
    "Win32_System_Com",
    # An AppUserModelID is a property on a Start-menu shortcut, and a property
    # on a shortcut is a PROPVARIANT in an IPropertyStore.
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    # PROPVARIANT, which is what a shortcut's property is.
    "Win32_System_Variant",
    # The tray's own message-only window has to name the module it belongs to.
    "Win32_System_LibraryLoader",
    # Starting with Windows is a value under `Run`, which is where the app's
    # autostart plugin put it -- so a reader who had it on still has it on.
    "Win32_System_Registry",
    # Copy and paste that cross to other windows. The clipboard is opened and
    # read through DataExchange; the text itself is a movable global handle,
    # which is what Memory is for.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # Direct3D, which is what the window draws through -- chosen over Vulkan
    # because rebuilding a swapchain on a resize costs 1.9ms here against
    # 97.7ms on the same adapter. See `d3d.rs`.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # Compiling the HLSL at startup.
    "Win32_Graphics_Direct3D_Fxc",
] }

[build-dependencies]
winresource = "0.1.31"
