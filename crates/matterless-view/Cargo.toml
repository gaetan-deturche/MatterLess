[package]
name = "matterless-view"
version = "0.1.0"
edition = "2024"

[dependencies]
cosmic-text = "0.19"
matterless-core = { path = "../matterless-core" }
matterless-layout = { path = "../matterless-layout" }
matterless-paint = { path = "../matterless-paint" }
matterless-render = { path = "../matterless-render" }
matterless-sidebar = { path = "../matterless-sidebar" }
matterless-ui = { path = "../matterless-ui" }
matterless-store = { path = "../matterless-store" }
matterless-sync = { path = "../matterless-sync" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# The socket runs on a thread of its own, so the window never blocks on it.
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
serde_json = "1"
# The session the app already established, read rather than collected: this
# window has no business asking for a password to mint a second one.
keyring = "3"
# The Vulkan backend is selected explicitly at instance creation; wgpu is the
# API on top of it rather than an abstraction over which one to use.
wgpu = "26"
# Only the standalone window needs these; the app supplies its own surface from
# the Tauri window, so they stay out of its dependency tree.
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }
# Headless verification: the same rows written out as an image, for a machine
# with no display and for comparing against the DOM list.
png = { version = "0.18", optional = true }

[features]
# On by default so the standalone window is one command; the app turns it off,
# because it supplies its own surface from the Tauri window and has no use for
# a second windowing library.
default = ["window"]
window = ["winit", "pollster", "png"]

[[bin]]
name = "matterless-view"
required-features = ["window"]
