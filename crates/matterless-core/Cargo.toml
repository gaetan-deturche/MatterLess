[package]
name = "matterless-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
    "http2",
    "gzip",
    "charset",
    "query",
    # A streaming request body, so an upload can report how far it has got.
    "stream",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt"] }
